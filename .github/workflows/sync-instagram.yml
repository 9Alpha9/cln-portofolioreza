name: Sync YouTube Videos

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-youtube-videos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Install yt-dlp and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Sync YouTube Videos & Upload to Vercel Blob
        env:
          YOUTUBE_CHANNEL_ID: "UCLd2quRGf0O-4DdDHpgkMTQ"
          YOUTUBE_MAX_VIDEOS: "15"
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/sync-youtube.mjs

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add content/media/youtube-media.json
          if git diff --staged --quiet; then
            echo "No YouTube media changes."
            exit 0
          fi
          git commit -m "chore: sync youtube media with blob urls [skip ci]"
          git push
