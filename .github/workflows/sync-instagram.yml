name: Sync Instagram Media

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-instagram-media
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install instaloader
        run: python -m pip install --disable-pip-version-check instaloader

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Fetch Instagram Media
        env:
          INSTAGRAM_USERNAME: tahutech.idn
          INSTAGRAM_STRICT: "true"
        run: python scripts/sync-instagram.py

      - name: Upload latest videos to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          INSTAGRAM_BLOB_MAX_VIDEOS: "3"
        run: node scripts/upload-instagram-videos.mjs

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add content/media/instagram-media.json
          if git diff --staged --quiet; then
            echo "No Instagram media changes."
            exit 0
          fi
          git commit -m "chore: sync instagram media [skip ci]"
          git push
