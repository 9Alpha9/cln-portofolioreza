name: Sync Instagram Media

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install instaloader
        run: pip install instaloader

      - name: Fetch Instagram Media
        run: python scripts/sync-instagram.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/instagram-media.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync instagram media [skip ci]" && git push)
